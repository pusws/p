<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="WebNav Hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa733" />
      <stop offset="1" stop-color="#ff6a00" />
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a" />
      <stop offset="1" stop-color="#000000" />
    </linearGradient>
  </defs>

  <!-- 品牌渐变底板（圆角方形，适配各浏览器的图标形状裁切） -->
  <rect width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- 刻度环（小幅内缩，避免 16px 下糊成一团） -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#0d0d0d" stroke-opacity="0.16" stroke-width="1.6" />

  <!-- 指南针四向指针：北向为主，其余为副 -->
  <path d="M32 8 38 25.6 32 31 26 25.6Z" fill="url(#needle)" />
  <path d="M32 56 26 38.4 32 33 38 38.4Z" fill="#0d0d0d" fill-opacity="0.62" />
  <path d="M56 32 38.4 38 33 32 38.4 26Z" fill="#0d0d0d" fill-opacity="0.78" />
  <path d="M8 32 25.6 26 31 32 25.6 38Z" fill="#0d0d0d" fill-opacity="0.78" />

  <!-- 中心点 -->
  <circle cx="32" cy="32" r="3.4" fill="#0d0d0d" />
</svg>
