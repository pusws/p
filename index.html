<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff9000" />
    <meta name="description" content="WebNav Hub - 现代化网址导航网站">
    
    <title>WebNav Hub</title>
    
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- PWA相关 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    
    <!-- 提前与图标 CDN 建立连接，缩短阻塞渲染的图标样式的等待时间 -->
    <link rel="preconnect" href="https://cdnfortawesome.cdns.ndjp.net">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnfortawesome.cdns.ndjp.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css" />
</head>

<body>
    <div id="loadingIndicator" class="loading-indicator">
        <div class="spinner"></div>
        <p>加载中...</p>
    </div>
    
    <header>
        <h1>WebNav Hub</h1>
    </header>
    <nav aria-label="分类导航">
        <ul>
            <li><a href="#ai-search" class="active" aria-current="location">Ai搜索</a></li>
            <li><a href="#social">托管社交</a></li>
            <li><a href="#tools">实用工具</a></li>
            <li><a href="#tech-news">科技资讯</a></li>
            <li><a href="#cloud-storage">云存储</a></li>
            <li><a href="#email">电子邮箱</a></li>
        </ul>
    </nav>
    <main id="main-content">
        <!-- 动态内容将通过JavaScript生成 -->
    </main>
    <footer>
        <p>© <span id="copyright-year">2025</span> WebNav Hub. 保留所有权利。</p>
    </footer>
    <script src="main.js" defer></script>
</body>

</html>
